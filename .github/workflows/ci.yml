# Verifies the repo builds on every push/PR so GitHub shows a green check before deploy.
name: CI

# Push runs on EVERY branch, not just the long-lived ones. Feature work here
# lives on branches like backupV4 for weeks at a time, and restricting pushes to
# main/master/develop meant 54 commits of receiving work — six migrations and
# four new endpoints — landed with no CI run at all. A green check that only
# appears after merge is a check that arrives too late to be worth having.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master, develop]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Production build
        run: npm run build
        env:
          # Deliberately false. Create React App treats every ESLint warning as a
          # build error when CI=true, and this repo carries ~45 pre-existing
          # warnings (unused vars, react-hooks/exhaustive-deps) across a dozen
          # pages. They still print in the log above, but they no longer break
          # the build. Flip this back to "true" once those warnings are cleared.
          CI: false
          # Placeholder; set real URL in your host's env (e.g. Netlify/Vercel).
          REACT_APP_API_URL: https://example.com/api

  backend:
    name: Backend (Composer + tests)
    runs-on: ubuntu-latest

    # This project's schema is a phpMyAdmin SQL dump (airkingv5.sql at the repo
    # root), NOT a migration chain. database/migrations holds only ALTER-style
    # migrations that assume the base tables already exist — there has never
    # been a create_locations_table, so `php artisan migrate` on an empty
    # database fails on the very first migration. CI therefore stands up a
    # MariaDB matching local dev and imports the dump, exactly like a developer
    # workstation does.
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: airkingV5_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    defaults:
      run:
        working-directory: back-end

    # Point every artisan command at the MariaDB service above.
    #
    # `cp .env.example .env` below writes DB_CONNECTION=sqlite, which is the
    # right default for a developer opening the repo but wrong for this job:
    # the dump goes into MariaDB, so a migrate that follows .env lands on an
    # empty SQLite file instead. Laravel then CREATES that file and fails on the
    # very first migration, because these are ALTER-style migrations that assume
    # the dump's base tables already exist — the same failure the comment above
    # describes for an empty database.
    #
    # Set here rather than by sed-ing .env because real environment variables
    # win over .env (Laravel's Dotenv never overwrites an existing one), so this
    # holds for migrate, the seeders and the test run alike. The values match
    # what phpunit.xml already declares, so nothing disagrees.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: airkingV5_test
      DB_USERNAME: root
      DB_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # Matches local dev (8.2.30); composer.json requires ^8.2.
          php-version: "8.2"
          # gd is required by the tests, not by the app: Laravel's
          # UploadedFile::fake()->image() generates a real image to upload, and
          # throws "GD extension is not installed" without it. Leaving it out
          # fails 13 tests across IncidentPhotoUploadTest, AccountAvatarTest and
          # AccountPolicyEnforcementTest for a reason that has nothing to do with
          # the code under test.
          extensions: mbstring, xml, ctype, json, pdo_mysql, bcmath, gd
          coverage: none
      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('back-end/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - run: composer install --no-interaction --prefer-dist
      - name: Prepare app env
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root --silent; then
              echo "MariaDB is up"; exit 0
            fi
            sleep 2
          done
          echo "MariaDB did not become ready"; exit 1
      - name: Import schema dump
        # phpunit.xml points the test suite at airkingV5_test on 127.0.0.1 as
        # root with an empty password, which is what the service provides.
        run: mysql -h 127.0.0.1 -P 3306 -u root airkingV5_test < ../airkingv5.sql

      # The dump is a point-in-time snapshot and lags the code — it carries
      # neither the incident_items/incident_evidence tables nor any of the
      # 2026_08_* migrations in its `migrations` table. Importing it alone
      # leaves ~150 incident tests failing against a schema three days old.
      #
      # `migrate` works here even though it fails on an EMPTY database: the
      # dump supplies the base tables the ALTER-style migrations assume, and
      # every migration this repo adds on top is either a CREATE for a new
      # table or an ALTER on one the dump already has.
      - name: Apply migrations added since the dump
        run: php artisan migrate --force --no-interaction

      # Migrations create columns; they do not create the ROWS the code looks
      # up by name. Statuses are resolved by name because their ids differ
      # between installs, so an unseeded lookup throws at runtime rather than
      # failing a schema check. Permissions and nav bundles are the same story.
      - name: Seed lookups the tests resolve by name
        run: |
          php artisan db:seed --class=IncidentStatusSeeder --force
          php artisan db:seed --class=PermissionSeeder --force
          php artisan db:seed --class=RolePermissionsSeeder --force
          php artisan db:seed --class=NavBundleSeeder --force

      - run: php artisan test
