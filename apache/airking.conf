# ============================================================
#  Airking Inventory - Apache configuration (ports 80 and 443)
#
#  Architecture (single origin, no CORS, mod_php concurrency):
#    - Public site on *:80 AND *:443 serves the React production build
#      (frontend/build) as the site root, with SPA fallback for client routes.
#    - /api and /storage are reverse-proxied to the Laravel app, which is
#      served NATIVELY AT ROOT on an internal port (127.0.0.1:8081). Serving
#      Laravel at root (not under an Alias) is required so it sees the full
#      "/api/..." path and matches its api-prefixed routes.
#
#  The app is the DEFAULT site on both ports, so it answers on
#  http(s)://localhost/ and the machine LAN IP for desktop + mobile.
#  phpMyAdmin stays reachable at http://localhost/phpmyadmin.
#
#  WHY HTTPS EXISTS HERE (it is not about deployment):
#    getUserMedia — the browser camera API used by the barcode scanner and by
#    incident evidence photos — only runs in a SECURE CONTEXT. Browsers exempt
#    localhost, so the laptop works over plain HTTP; a phone reaching this
#    machine by LAN IP does not, and the camera is refused outright.
#    The alternative was making every device set
#    chrome://flags/#unsafely-treat-insecure-origin-as-secure and relaunch,
#    which is per-device, Chrome-only, and resets on update. HTTPS with a
#    self-signed cert replaces that with a one-time "Advanced -> Proceed".
#
#    The certificate is SELF-SIGNED and LAN-only: no hosting, no domain, no
#    internet. Regenerate it (e.g. if the LAN IP changes) with:
#
#      cd C:/xampp/apache/conf
#      set OPENSSL_CONF=C:/xampp/apache/conf/openssl.cnf
#      ..\bin\openssl req -x509 -newkey rsa:2048 -sha256 -days 825 -nodes ^
#        -keyout ssl.key/airking.key -out ssl.crt/airking.crt ^
#        -subj "//CN=Airking Inventory LAN" ^
#        -addext "subjectAltName=DNS:localhost,DNS:airking.local,IP:127.0.0.1,IP:<NEW-IP>"
#
#    Port 80 is deliberately left working exactly as before, so nothing that
#    relies on it breaks. Devices that do not need the camera can keep using it.
#
#  Requires: mod_rewrite, mod_alias, mod_proxy, mod_proxy_http, mod_ssl,
#            mod_headers (for the X-Forwarded-Proto headers below)
#  (all enabled in httpd.conf). See DEPLOYMENT.md. Restart Apache after any change.
#
#  NOTE: there is deliberately no "Listen 443" here — conf/extra/httpd-ssl.conf
#  already declares it, and a duplicate stops Apache from starting.
# ============================================================

# Internal port for the Laravel backend (loopback only — not exposed on the LAN).
Listen 127.0.0.1:8081

# ---- Backend: Laravel served natively at root on 127.0.0.1:8081 ----
<VirtualHost 127.0.0.1:8081>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs/Airking_Inventory/back-end/public"

    <Directory "C:/xampp/htdocs/Airking_Inventory/back-end/public">
        Options +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/airking-api-error.log"
    CustomLog "logs/airking-api-access.log" common
</VirtualHost>

# ---- Public site: React SPA on *:80 + reverse proxy to the API ----
<VirtualHost *:80>
    ServerName localhost
    ServerAlias airking.local

    DocumentRoot "C:/xampp/htdocs/Airking_Inventory/frontend/build"

    # Reverse-proxy the API and file storage to Laravel (same origin => no CORS).
    ProxyPreserveHost On

    # mod_proxy_http forwards X-Forwarded-For/-Host but NOT the scheme, and the
    # internal hop is plain HTTP either way. Laravel trusts these from loopback
    # only (see back-end/bootstrap/app.php) and uses the scheme to build absolute
    # URLs and to decide whether a cookie may be marked Secure.
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port  "80"

    ProxyPass        /api     http://127.0.0.1:8081/api
    ProxyPassReverse /api     http://127.0.0.1:8081/api
    ProxyPass        /storage http://127.0.0.1:8081/storage
    ProxyPassReverse /storage http://127.0.0.1:8081/storage

    # Preserve phpMyAdmin at http://localhost/phpmyadmin
    ProxyPass /phpmyadmin !
    Alias /phpmyadmin "C:/xampp/phpMyAdmin"
    <Directory "C:/xampp/phpMyAdmin">
        AllowOverride All
        Require all granted
    </Directory>

    # React SPA: serve real files, fall back to index.html for client-side routes.
    <Directory "C:/xampp/htdocs/Airking_Inventory/frontend/build">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        RewriteRule ^ index.html [L]
    </Directory>

    ErrorLog "logs/airking-error.log"
    CustomLog "logs/airking-access.log" common
</VirtualHost>

# ---- Public site over HTTPS on *:443 ----
# Mirrors the *:80 vhost exactly, plus TLS. This block is defined BEFORE the
# _default_:443 vhost in conf/extra/httpd-ssl.conf (httpd.conf includes
# httpd-vhosts.conf at line 521 and httpd-ssl.conf at 545), so the app — not
# XAMPP's default folder — is what answers https://<this machine>/.
<VirtualHost *:443>
    ServerName localhost
    ServerAlias airking.local

    DocumentRoot "C:/xampp/htdocs/Airking_Inventory/frontend/build"

    SSLEngine on
    SSLCertificateFile      "conf/ssl.crt/airking.crt"
    SSLCertificateKeyFile   "conf/ssl.key/airking.key"

    # Reverse-proxy the API and file storage to Laravel (same origin => no CORS).
    # The backend stays plain HTTP on loopback: it never leaves this machine, so
    # TLS terminates here and the internal hop needs no certificate of its own.
    ProxyPreserveHost On

    # TLS ends here; the internal hop is plain HTTP. Without this header Laravel
    # believes the whole request was insecure and emits http:// links into an
    # https:// page (blocked as mixed content). Trusted from loopback only.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    ProxyPass        /api     http://127.0.0.1:8081/api
    ProxyPassReverse /api     http://127.0.0.1:8081/api
    ProxyPass        /storage http://127.0.0.1:8081/storage
    ProxyPassReverse /storage http://127.0.0.1:8081/storage

    # Preserve phpMyAdmin at https://localhost/phpmyadmin
    ProxyPass /phpmyadmin !
    Alias /phpmyadmin "C:/xampp/phpMyAdmin"
    <Directory "C:/xampp/phpMyAdmin">
        AllowOverride All
        Require all granted
    </Directory>

    # React SPA: serve real files, fall back to index.html for client-side routes.
    <Directory "C:/xampp/htdocs/Airking_Inventory/frontend/build">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        RewriteRule ^ index.html [L]
    </Directory>

    ErrorLog "logs/airking-ssl-error.log"
    CustomLog "logs/airking-ssl-access.log" common
</VirtualHost>
