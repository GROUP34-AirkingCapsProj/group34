# Send only "Apache" in the Server header, not the version and module list.
ServerTokens Prod

# Render (and most PaaS hosts) tell the container which port to bind via $PORT.
# Apache expands ${PORT} from the process environment at startup; the Dockerfile
# sets a default so a plain `docker run` still works.
Listen ${PORT}

<IfModule ssl_module>
	Listen 443
</IfModule>

<IfModule mod_gnutls.c>
	Listen 443
</IfModule>
