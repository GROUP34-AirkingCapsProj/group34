<VirtualHost *:${PORT}>
	# Laravel's front controller lives in public/ — never expose the app root,
	# or .env, storage/ and vendor/ become fetchable over HTTP.
	DocumentRoot /var/www/html/public

	<Directory /var/www/html/public>
		Options -Indexes +FollowSymLinks
		# Required: public/.htaccess holds Laravel's rewrite to index.php.
		AllowOverride All
		Require all granted
	</Directory>

	# Render terminates TLS at its edge and forwards over HTTP, so trust the
	# proxy's X-Forwarded-For for the client IP. Laravel's TrustProxies
	# middleware handles the scheme/host side of the same problem.
	RemoteIPHeader X-Forwarded-For

	# Log to the container's stdout/stderr so `render logs` (or `docker logs`)
	# shows them; writing to files inside an ephemeral container loses them.
	ErrorLog /dev/stderr
	CustomLog /dev/stdout combined

	# Don't advertise the exact PHP build in every response.
	Header always unset X-Powered-By
	ServerSignature Off
</VirtualHost>
