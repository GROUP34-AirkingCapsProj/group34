; Production PHP settings for the Airking Inventory API container.

; --- Error handling -------------------------------------------------------
; Never render errors into the HTTP response in production; Laravel logs them
; through the `stderr` channel instead.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- OPcache --------------------------------------------------------------
; Matches DEPLOYMENT.md: without OPcache, PHP recompiles every file on every
; request, which is the single biggest per-request cost.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The image is immutable, so the files can never change under a running
; container — skip the stat() on every include.
opcache.validate_timestamps = 0

; --- Limits ---------------------------------------------------------------
memory_limit = 512M
max_execution_time = 60
; Receiving/label imports and PDF exports move more than the 2M default.
upload_max_filesize = 32M
post_max_size = 32M

; --- Misc -----------------------------------------------------------------
expose_php = Off
; config/app.php sets `timezone => UTC`; keep the PHP default identical so
; anything running before Laravel boots agrees with the app.
date.timezone = UTC
