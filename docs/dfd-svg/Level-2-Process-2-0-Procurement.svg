<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1208" height="942" viewBox="0 0 1208 942" role="img" aria-label="Gane and Sarson data flow diagram: Level 2 - Process 2.0 Procurement">
  <style>
