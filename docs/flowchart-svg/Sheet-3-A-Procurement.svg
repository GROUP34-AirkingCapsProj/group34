<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1046" viewBox="0 0 900 1046" role="img"
           aria-label="Flowchart sheet 3. From connector A, enter purchase request details, compute the total and the per-branch subtotals, and save the request as pending. Test manager approval; rejection sets the status and returns to the menu. On approval, enter supplier and prices, create the purchase order, and test its approval. Rejection sets the order to rejected and approval sets it to approved, then flow returns to connector M.">
  <style>
    svg { background: #ffffff; }
    .sym  { fill: #ffffff; stroke: #000000; stroke-width: 1.7; }
    .flow { fill: none; stroke: #000000; stroke-width: 1.6; }
    .jn   { fill: #000000; stroke: none; }
    .mk   { fill: #000000; }
    .t  { font-family: Arial, Helvetica, sans-serif; font-size: 12.5px; fill: #000000; text-anchor: middle; }
    .tb { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #000000; text-anchor: middle; }
    .tc { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #000000; text-anchor: middle; }
    .yn { font-family: Arial, Helvetica, sans-serif; font-size: 11.5px; font-weight: 700; fill: #000000; }
    .nt { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #555555; }
  </style>

        <defs>
          <marker id="f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path class="mk" d="M0,0 L10,5 L0,10 z"></path>
          </marker>
        </defs>

        <circle class="sym" cx="280" cy="40" r="22"></circle>
        <text class="tc" x="280" y="46">A</text>
        <text class="nt" x="312" y="44">from Sheet 2</text>

        <line class="flow" x1="280" y1="62" x2="280" y2="94" marker-end="url(#f3)"></line>

        <polygon class="sym" points="174,96 410,96 386,148 150,148"></polygon>
        <text class="t" x="280" y="118">Enter PR: branch, items,</text>
        <text class="t" x="280" y="135">quantities, needed date</text>

        <line class="flow" x1="280" y1="148" x2="280" y2="178" marker-end="url(#f3)"></line>

        <rect class="sym" x="150" y="180" width="260" height="56"></rect>
        <text class="t" x="280" y="204">Compute PR total and</text>
        <text class="t" x="280" y="221">per-branch subtotals</text>

        <line class="flow" x1="280" y1="236" x2="280" y2="266" marker-end="url(#f3)"></line>

        <rect class="sym" x="150" y="268" width="260" height="56"></rect>
        <text class="t" x="280" y="300">Save PR — status = Pending</text>

        <line class="flow" x1="280" y1="324" x2="280" y2="354" marker-end="url(#f3)"></line>

        <polygon class="sym" points="280,356 410,404 280,452 150,404"></polygon>
        <text class="t" x="280" y="400">Manager</text>
        <text class="t" x="280" y="416">approves?</text>

        <line class="flow" x1="410" y1="404" x2="508" y2="404" marker-end="url(#f3)"></line>
        <text class="yn" x="432" y="396">No</text>

        <rect class="sym" x="510" y="376" width="260" height="56"></rect>
        <text class="t" x="640" y="408">Set PR status = Rejected</text>

        <path class="flow" d="M770,404 H860 V990 H304" marker-end="url(#f3)"></path>

        <line class="flow" x1="280" y1="452" x2="280" y2="482" marker-end="url(#f3)"></line>
        <text class="yn" x="292" y="472">Yes</text>

        <rect class="sym" x="150" y="484" width="260" height="56"></rect>
        <text class="t" x="280" y="508">Set PR = Approved or</text>
        <text class="t" x="280" y="525">Partially Approved</text>

        <line class="flow" x1="280" y1="540" x2="280" y2="570" marker-end="url(#f3)"></line>

        <polygon class="sym" points="174,572 410,572 386,624 150,624"></polygon>
        <text class="t" x="280" y="603">Enter supplier and unit prices</text>

        <line class="flow" x1="280" y1="624" x2="280" y2="654" marker-end="url(#f3)"></line>

        <rect class="sym" x="150" y="656" width="260" height="56"></rect>
        <text class="t" x="280" y="680">Create PO linked to the PR</text>
        <text class="t" x="280" y="697">— status = Pending</text>

        <line class="flow" x1="280" y1="712" x2="280" y2="742" marker-end="url(#f3)"></line>

        <polygon class="sym" points="280,744 410,792 280,840 150,792"></polygon>
        <text class="t" x="280" y="796">PO approved?</text>

        <line class="flow" x1="410" y1="792" x2="508" y2="792" marker-end="url(#f3)"></line>
        <text class="yn" x="432" y="784">No</text>

        <rect class="sym" x="510" y="764" width="260" height="56"></rect>
        <text class="t" x="640" y="796">Set PO = Rejected</text>

        <path class="flow" d="M770,792 H860"></path>
        <circle class="jn" cx="860" cy="792" r="4"></circle>

        <line class="flow" x1="280" y1="840" x2="280" y2="870" marker-end="url(#f3)"></line>
        <text class="yn" x="292" y="860">Yes</text>

        <rect class="sym" x="150" y="872" width="260" height="56"></rect>
        <text class="t" x="280" y="904">Set PO = Approved</text>

        <line class="flow" x1="280" y1="928" x2="280" y2="964" marker-end="url(#f3)"></line>

        <circle class="sym" cx="280" cy="990" r="22"></circle>
        <text class="tc" x="280" y="996">M</text>
        <text class="nt" x="312" y="994">back to Sheet 2</text>
      </svg>
