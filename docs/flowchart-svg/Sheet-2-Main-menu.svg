<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1110" viewBox="0 0 900 1110" role="img"
           aria-label="Flowchart sheet 2. From connector M, a chain of decisions asks whether the user chose procurement, receiving, issuance, transfer, or incident and warranty, each exiting to connectors A through E. If the user chooses to log out, the token is revoked and an activity log written before End; otherwise flow returns to the top of the menu.">
  <style>
    svg { background: #ffffff; }
    .sym  { fill: #ffffff; stroke: #000000; stroke-width: 1.7; }
    .flow { fill: none; stroke: #000000; stroke-width: 1.6; }
    .jn   { fill: #000000; stroke: none; }
    .mk   { fill: #000000; }
    .t  { font-family: Arial, Helvetica, sans-serif; font-size: 12.5px; fill: #000000; text-anchor: middle; }
    .tb { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #000000; text-anchor: middle; }
    .tc { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #000000; text-anchor: middle; }
    .yn { font-family: Arial, Helvetica, sans-serif; font-size: 11.5px; font-weight: 700; fill: #000000; }
    .nt { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #555555; }
  </style>

        <defs>
          <marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path class="mk" d="M0,0 L10,5 L0,10 z"></path>
          </marker>
        </defs>

        <circle class="sym" cx="280" cy="40" r="22"></circle>
        <text class="tc" x="280" y="46">M</text>
        <text class="nt" x="312" y="44">main menu — every branch returns here</text>

        <line class="flow" x1="280" y1="62" x2="280" y2="110" marker-end="url(#f2)"></line>
        <circle class="jn" cx="280" cy="88" r="4"></circle>

        <polygon class="sym" points="280,112 410,160 280,208 150,160"></polygon>
        <text class="t" x="280" y="164">Procurement?</text>
        <line class="flow" x1="410" y1="160" x2="616" y2="160" marker-end="url(#f2)"></line>
        <text class="yn" x="432" y="152">Yes</text>
        <circle class="sym" cx="640" cy="160" r="22"></circle>
        <text class="tc" x="640" y="166">A</text>
        <text class="nt" x="672" y="164">Sheet 3</text>

        <line class="flow" x1="280" y1="208" x2="280" y2="250" marker-end="url(#f2)"></line>
        <text class="yn" x="292" y="234">No</text>

        <polygon class="sym" points="280,252 410,300 280,348 150,300"></polygon>
        <text class="t" x="280" y="304">Receiving?</text>
        <line class="flow" x1="410" y1="300" x2="616" y2="300" marker-end="url(#f2)"></line>
        <text class="yn" x="432" y="292">Yes</text>
        <circle class="sym" cx="640" cy="300" r="22"></circle>
        <text class="tc" x="640" y="306">B</text>
        <text class="nt" x="672" y="304">Sheet 4</text>

        <line class="flow" x1="280" y1="348" x2="280" y2="390" marker-end="url(#f2)"></line>
        <text class="yn" x="292" y="374">No</text>

        <polygon class="sym" points="280,392 410,440 280,488 150,440"></polygon>
        <text class="t" x="280" y="444">Issuance?</text>
        <line class="flow" x1="410" y1="440" x2="616" y2="440" marker-end="url(#f2)"></line>
        <text class="yn" x="432" y="432">Yes</text>
        <circle class="sym" cx="640" cy="440" r="22"></circle>
        <text class="tc" x="640" y="446">C</text>
        <text class="nt" x="672" y="444">Sheet 5</text>

        <line class="flow" x1="280" y1="488" x2="280" y2="530" marker-end="url(#f2)"></line>
        <text class="yn" x="292" y="514">No</text>

        <polygon class="sym" points="280,532 410,580 280,628 150,580"></polygon>
        <text class="t" x="280" y="584">Transfer?</text>
        <line class="flow" x1="410" y1="580" x2="616" y2="580" marker-end="url(#f2)"></line>
        <text class="yn" x="432" y="572">Yes</text>
        <circle class="sym" cx="640" cy="580" r="22"></circle>
        <text class="tc" x="640" y="586">D</text>
        <text class="nt" x="672" y="584">Sheet 6</text>

        <line class="flow" x1="280" y1="628" x2="280" y2="670" marker-end="url(#f2)"></line>
        <text class="yn" x="292" y="654">No</text>

        <polygon class="sym" points="280,672 410,720 280,768 150,720"></polygon>
        <text class="t" x="280" y="716">Incident or</text>
        <text class="t" x="280" y="732">warranty?</text>
        <line class="flow" x1="410" y1="720" x2="616" y2="720" marker-end="url(#f2)"></line>
        <text class="yn" x="432" y="712">Yes</text>
        <circle class="sym" cx="640" cy="720" r="22"></circle>
        <text class="tc" x="640" y="726">E</text>
        <text class="nt" x="672" y="724">Sheet 7</text>

        <line class="flow" x1="280" y1="768" x2="280" y2="810" marker-end="url(#f2)"></line>
        <text class="yn" x="292" y="794">No</text>

        <polygon class="sym" points="280,812 410,860 280,908 150,860"></polygon>
        <text class="t" x="280" y="864">Log out?</text>

        <path class="flow" d="M150,860 H70 V88 H276" marker-end="url(#f2)"></path>
        <text class="yn" x="106" y="852">No</text>
        <text class="nt" x="80" y="472" transform="rotate(-90 80 472)" text-anchor="middle">return to menu</text>

        <line class="flow" x1="280" y1="908" x2="280" y2="938" marker-end="url(#f2)"></line>
        <text class="yn" x="292" y="928">Yes</text>

        <rect class="sym" x="150" y="938" width="260" height="56"></rect>
        <text class="t" x="280" y="962">Revoke token;</text>
        <text class="t" x="280" y="979">write activity log</text>

        <line class="flow" x1="280" y1="994" x2="280" y2="1024" marker-end="url(#f2)"></line>

        <rect class="sym" x="190" y="1026" width="180" height="48" rx="24"></rect>
        <text class="tb" x="280" y="1056">END</text>
      </svg>
