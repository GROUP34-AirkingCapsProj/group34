<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-label="Module map showing how the ten ERD subject areas reference one another">
  <style>
    svg { background:#ffffff; }
    .mod    { fill:#ffffff; stroke:#000; stroke-width:1.8; }
    .shared { fill:#eef1f4; }
    .audit  { fill:#f7f7f7; stroke-dasharray:6 4; }
    .railbg { fill:#fafbfc; stroke:#b9c2ca; stroke-width:1.2; stroke-dasharray:4 3; }
    .railcap{ font-family:Arial,Helvetica,sans-serif; font-size:9.5px; letter-spacing:.12em; fill:#67727d; }
    .ml { font-family:Arial,Helvetica,sans-serif; font-size:14px; font-weight:700; fill:#000; }
    .mn { font-family:Arial,Helvetica,sans-serif; font-size:13.5px; font-weight:700; fill:#000; }
    .ms { font-family:Arial,Helvetica,sans-serif; font-size:10.5px; fill:#5d6873; }
    .mc { font-family:Arial,Helvetica,sans-serif; font-size:9.5px; fill:#8b959e; }
    .lk { fill:none; stroke:#000; stroke-width:1.8; }
    .weak { stroke-width:1.1; stroke-dasharray:4 3; }
    .hub { stroke:#8b959e; stroke-width:1.4; }
    .dash{ stroke:#8b959e; stroke-width:1.2; stroke-dasharray:5 4; }
    .lb { font-family:Arial,Helvetica,sans-serif; font-size:9.5px; fill:#3c4650; }
    .hb { font-family:Arial,Helvetica,sans-serif; font-size:10px; fill:#5d6873; }
  </style><defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect class="railbg" x="24" y="60" width="262" height="392"/><text class="railcap" x="155" y="82" text-anchor="middle">SHARED ACROSS ALL MODULES</text><rect class="mod shared" x="40" y="92" width="230" height="76"/><text class="ml" x="52" y="113">C</text><text class="mn" x="74" y="113">Reference Data</text><text class="ms" x="52" y="131">8 lookup tables</text><text class="mc" x="258" y="158" text-anchor="end">9 entities</text><rect class="mod shared" x="40" y="198" width="230" height="76"/><text class="ml" x="52" y="219">A</text><text class="mn" x="74" y="219">Users and Access</text><text class="ms" x="52" y="237">roles, permissions</text><text class="mc" x="258" y="264" text-anchor="end">12 entities</text><rect class="mod shared" x="40" y="304" width="230" height="76"/><text class="ml" x="52" y="325">B</text><text class="mn" x="74" y="325">Products and Catalogue</text><text class="ms" x="52" y="343">products, sets, suppliers</text><text class="mc" x="258" y="370" text-anchor="end">11 entities</text><rect class="mod" x="430" y="86" width="300" height="84"/><text class="ml" x="442" y="107">D</text><text class="mn" x="464" y="107">Procurement</text><text class="ms" x="442" y="125">PR / PO / returns</text><text class="mc" x="718" y="160" text-anchor="end">6 entities</text><rect class="mod" x="430" y="232" width="300" height="84"/><text class="ml" x="442" y="253">E</text><text class="mn" x="464" y="253">Receiving and Scanning</text><text class="ms" x="442" y="271">drafts, GRN, corrections</text><text class="mc" x="718" y="306" text-anchor="end">9 entities</text><rect class="mod" x="430" y="378" width="300" height="84"/><text class="ml" x="442" y="399">F</text><text class="mn" x="464" y="399">Inventory and Stock</text><text class="ms" x="442" y="417">batches, serials, holds</text><text class="mc" x="718" y="452" text-anchor="end">8 entities</text><rect class="mod" x="830" y="378" width="230" height="84"/><text class="ml" x="842" y="399">H</text><text class="mn" x="864" y="399">Transfers</text><text class="ms" x="842" y="417">branch to branch</text><text class="mc" x="1048" y="452" text-anchor="end">3 entities</text><rect class="mod" x="330" y="546" width="250" height="84"/><text class="ml" x="342" y="567">G</text><text class="mn" x="364" y="567">Issuance and Sales</text><text class="ms" x="342" y="585">quotes, picking, sales</text><text class="mc" x="568" y="620" text-anchor="end">8 entities</text><rect class="mod" x="630" y="546" width="300" height="84"/><text class="ml" x="642" y="567">I</text><text class="mn" x="664" y="567">Incident and Warranty</text><text class="ms" x="642" y="585">quarantine, claims</text><text class="mc" x="918" y="620" text-anchor="end">8 entities</text><rect class="mod audit" x="830" y="700" width="230" height="76"/><text class="ml" x="842" y="721">J</text><text class="mn" x="864" y="721">Audit and Reporting</text><text class="ms" x="842" y="739">write-only</text><text class="mc" x="1048" y="766" text-anchor="end">4 entities</text><path class="lk" d="M580,170 L580,232" marker-end="url(#mk)"/><text class="lb" x="587" y="195">5 · purchase_orders</text><path class="lk" d="M580,316 L580,378" marker-end="url(#mk)"/><text class="lb" x="587" y="341">2 · receivings</text><path class="lk weak" d="M580,462 L580,500 L455,500 L455,546" marker-end="url(#mk)"/><text class="lb" x="462" y="494">1 · inventory_batches</text><path class="lk" d="M580,588 L630,588" marker-end="url(#mk)"/><text class="lb" x="612" y="582">5 · issuances, customers</text><path class="lk" d="M730,274 L790,274 L790,512 L780,512 L780,546" marker-end="url(#mk)"/><text class="lb" x="797" y="506">2 · adjustments, scan_corrections</text><path class="lk" d="M580,462 L580,508 L780,508 L780,546" marker-end="url(#mk)"/><text class="lb" x="787" y="502">2 · inventory_batches, item_serial</text><path class="lk weak" d="M830,420 L730,420" marker-end="url(#mk)"/><text class="lb" x="787" y="414">1 · transfers</text><path class="lk weak" d="M945,378 L945,340 L770,340 L770,274 L730,274" marker-end="url(#mk)"/><text class="lb" x="777" y="334">1 · transfers</text><path class="lk" d="M270,342 L350,342 L350,128 L430,128" marker-end="url(#mk)"/><text class="lb" x="357" y="122">5 · suppliers, aircon_models</text><path class="lk" d="M155,168 L155,304" marker-end="url(#mk)"/><text class="lb" x="162" y="230">9 · lookups</text><path class="lk hub" d="M286,256 L360,256 L360,428 L430,428" marker-end="url(#mk)"/><path class="lk hub" d="M360,256 L430,256" marker-end="url(#mk)"/><path class="lk hub" d="M360,128 L430,128" marker-end="url(#mk)"/><text class="hb" x="296" y="248">users · products · locations · status_lookup</text><text class="hb" x="296" y="266">109 of the 150 cross-module references</text><path class="lk dash" d="M930,588 L1090,588 L1090,738 L1060,738" marker-end="url(#mk)"/><text class="lb" x="946" y="580">every module writes here</text></svg>