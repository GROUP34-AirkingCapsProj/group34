<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#b91c1c" />
    <meta
      name="description"
      content="AirKing Air Conditioning inventory system — stock, purchasing, transfers and reporting."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <!--
      Paths above are absolute ("/favicon.ico"). Vite serves everything in
      public/ from the site root and copies it into build/ untouched, so these
      resolve the same in dev and in production. CRA's %PUBLIC_URL% placeholder
      is no longer needed; if this app is ever hosted under a sub-path, set
      `base` in vite.config.mjs rather than editing these by hand.
    -->
    <title>AirKing Inventory</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('airking-theme');
          if (t !== 'dark' && t !== 'light') t = 'light';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
          if (t === 'dark') {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#0f1419');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      Vite needs the entry module declared explicitly (CRA used to inject it).
      This file lives at the project root, not in public/, because Vite treats
      it as the build entry and transforms this script tag.

      Dev server: npm start     Production bundle: npm run build
    -->
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
